name: Supabase keep-alive

# Objetivo: evitar que Supabase pause el proyecto free tras 7 dias de
# inactividad. Le pegamos un ping diario al REST de Supabase.
#
# Requiere dos secrets en el repo:
#   - SUPABASE_URL       (ej. https://tfluitgarqtdjdbxugmq.supabase.co)
#   - SUPABASE_ANON_KEY  (la anon key publica)
#
# Instrucciones para agregarlos:
#   Repo en GitHub -> Settings -> Secrets and variables -> Actions
#   -> New repository secret (uno por cada uno).

on:
  schedule:
    # 12:00 UTC = 7:00 am Colombia (hora local)
    - cron: "0 12 * * *"
  # Permite dispararlo a mano desde la pestana Actions.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Faltan los secrets SUPABASE_URL o SUPABASE_ANON_KEY."
            exit 1
          fi
          echo "Pinging $SUPABASE_URL ..."
          # Cualquier request al REST de la base sirve para marcar actividad.
          # RLS puede filtrar filas con la anon key, pero el servidor igual
          # atiende la peticion y se resetea el reloj de auto-pause.
          http_code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/propietarios?select=id&limit=1")
          echo "HTTP $http_code"
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 500 ]; then
            echo "Ping OK (proyecto activo)."
          else
            echo "Ping FAILED. Respuesta:"
            cat /tmp/resp.txt
            exit 1
          fi
